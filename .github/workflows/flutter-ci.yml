name: flutter-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Unit tests
        run: flutter test --coverage

  emulator-gui-test:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    needs: analyze-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Install PulseAudio runtime for emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0

      - name: Start Android emulator and run GUI test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          force-avd-creation: true
          emulator-options: -no-snapshot -noaudio -no-boot-anim -audio none -camera-back none -camera-front none
          script: |
            adb wait-for-device
            adb devices
            DEVICE=$(adb devices | awk '/emulator-[0-9]+\s+device$/ {print $1; exit}')
            echo "Using device: ${DEVICE}"
            flutter devices
            flutter test integration_test/app_test.dart -d "$DEVICE" --no-pub --device-timeout 15m
            adb -s "$DEVICE" exec-out screencap -p > emulator-home.png

      - name: Upload emulator screenshot
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshot
          path: emulator-home.png

  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: analyze-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45
    needs: analyze-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build iOS app (unsigned)
        run: flutter build ios --release --no-codesign
