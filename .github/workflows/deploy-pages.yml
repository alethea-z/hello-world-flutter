name: Deploy BDD Test Report to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy-html-report:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker (optional, for consistent environment)
        run: echo "Using Ubuntu LTS"

      - name: Install Flutter (for dart scripts)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate BDD Test Report
        run: |
          # Run from the repository root (checkout already places code here)
          dart scripts/generate_test_report.dart
          # Convert markdown to HTML and copy golden screenshots
          python3 scripts/convert_md_to_html.py
          echo "HTML report ready at public/index.html"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          branch: gh-pages
